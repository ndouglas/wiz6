server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Gzip the small bundles + JSON data files
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
  gzip_min_length 1024;

  # SPA fallback: any path that doesn't match a real file falls back to
  # index.html so React Router (BrowserRouter) can handle the route.
  # NOTE: $uri/ is intentionally omitted — including it makes nginx try
  # to autoindex matching directories (e.g. /screens/ matches the
  # publicDir folder), which 403s with no index file, instead of falling
  # through to index.html. With this line, any non-file path goes
  # straight to index.html where React Router takes over.
  location / {
    try_files $uri /index.html;
  }

  # Hash-named assets get long-cache headers; SPA index never caches.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
  }
}
