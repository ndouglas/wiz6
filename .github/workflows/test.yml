name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4 # version comes from package.json "packageManager"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The parity vitest tests read extracted/fonts/*.json, and the e2e viewer
      # (served by Vite with publicDir=extracted/) loads fonts/msg/portraits from
      # there. extracted/ is gitignored, so regenerate it from the committed
      # binaries — same step the Docker image build runs.
      - name: Extract game assets
        run: pnpm extract

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit + parity tests
        run: pnpm test

      - name: Install Playwright Chromium
        run: pnpm --filter @wiz6/viewer exec playwright install --with-deps chromium

      - name: e2e (Playwright)
        run: pnpm --filter @wiz6/viewer test:e2e

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            packages/viewer/test-results/**
            packages/viewer/playwright-report/**
          if-no-files-found: ignore
          retention-days: 7
