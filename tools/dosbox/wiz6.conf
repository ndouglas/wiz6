# DOSBox-X config for Wiz6 sprite-ID dynamic capture.
# Boots wroot.exe with INT 21h file-open logging enabled. Each MON*.PIC open
# becomes a line in the log; cross-reference with the encounter you triggered
# to bind combatSpriteId -> filename.

[sdl]
output       = opengl
fullscreen   = false

[log]
logfile      = /Users/nathan/Projects/ndouglas/wiz6/tools/dosbox/dosbox.log
int21        = debug
fileio       = debug
files        = debug
# Palette investigation: log every BIOS INT 10h call + low-level VGA register I/O.
# This catches AX=1002h (set palette block) calls AND any direct OUT writes to
# the EGA attribute controller (0x3C0/0x3C1) or VGA DAC (0x3C8/0x3C9).
int10        = debug
vga          = debug
vgagfx       = debug
vgamisc      = debug
io           = debug
bios         = debug

[dosbox]
machine      = vgaonly
memsize      = 16
quit warning = false
saveremark   = false
captures     = /Users/nathan/Projects/ndouglas/wiz6/tools/dosbox/capture

[cpu]
cputype      = 386
cycles       = fixed 6000

[render]
aspect       = true

[autoexec]
mount c /Users/nathan/Projects/ndouglas/wiz6/original
c:
cls
wroot
