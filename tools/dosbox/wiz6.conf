# DOSBox-X config for Wiz6 sprite-ID dynamic capture.
# Boots wroot.exe with INT 21h file-open logging enabled. Each MON*.PIC open
# becomes a line in the log; cross-reference with the encounter you triggered
# to bind combatSpriteId -> filename.

[sdl]
output       = opengl
fullscreen   = false

[log]
logfile      = /Users/nathan/Projects/ndouglas/wiz6/tools/dosbox/dosbox.log
int21        = true
fileio       = true
files        = true

[dosbox]
machine      = vgaonly
memsize      = 16
quit warning = false

[cpu]
cputype      = 386
cycles       = max

[render]
aspect       = true

[autoexec]
mount c /Users/nathan/Projects/ndouglas/wiz6/original
c:
cls
wroot
