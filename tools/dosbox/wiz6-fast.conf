# wiz6-fast.conf — UN-THROTTLED config for AUTOMATED driving (build-saves.ts +
# automated MCP launches). Only the [cpu] section differs from wiz6.conf
# (cycles=max instead of fixed 6000) so screen transitions settle fast and the
# MCP screenshot isn't caught mid-transition. wiz6.conf stays throttled
# (cycles=fixed 6000) for human-paced inspection. Keep every OTHER section in
# sync with wiz6.conf.

[sdl]
output         = opengl
fullscreen     = false
mapperfile_sdl2 = /Users/nathan/Projects/ndouglas/wiz6/tools/dosbox/mapper-wiz6.map

[log]
logfile      = /Users/nathan/Projects/ndouglas/wiz6/tools/dosbox/dosbox.log
int21        = debug
fileio       = debug
files        = debug
# Palette investigation: log every BIOS INT 10h call + low-level VGA register I/O.
# This catches AX=1002h (set palette block) calls AND any direct OUT writes to
# the EGA attribute controller (0x3C0/0x3C1) or VGA DAC (0x3C8/0x3C9).
int10        = debug
vga          = debug
vgagfx       = debug
vgamisc      = debug
io           = debug
bios         = debug

[dosbox]
machine      = vgaonly
memsize      = 16
quit warning = false
saveremark   = false
captures     = /Users/nathan/Projects/ndouglas/wiz6/tools/dosbox/capture

[cpu]
cputype      = pentium_mmx
cycles       = max

[render]
aspect       = true

[autoexec]
mount c /Users/nathan/Projects/ndouglas/wiz6/original
c:
cls
wroot
