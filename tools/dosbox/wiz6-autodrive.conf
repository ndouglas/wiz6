# DOSBox-X config for MCP-driven Wiz6 capture.
# Boots wroot.exe with autosave enabled (a save state every 3 seconds into
# slots 1..30) and AUTOTYPE pressing keys to advance through the intro then
# navigate the main menu via keyboard.

[sdl]
output       = opengl
fullscreen   = false

[log]
logfile      = /Users/nathan/Projects/ndouglas/wiz6/tools/dosbox/dosbox-autodrive.log

[dosbox]
machine      = vgaonly
memsize      = 16
quit warning = false
saveremark   = false
# autosave = <interval-seconds> <slot-range>. Cycles through slots 1..30
# saving once every 3 s — fine enough resolution to catch each game-state
# transition without overwhelming disk.
autosave     = 3 1-30

[cpu]
cputype      = 386
cycles       = fixed 6000

[render]
aspect       = true

[autoexec]
mount c /Users/nathan/Projects/ndouglas/wiz6/original
c:
cls
# AUTOTYPE -w SECS schedules keystrokes to land SECS after the AUTOTYPE
# invocation. All commands here run from autoexec near t=0, so the -w
# values are absolute seconds from boot. We pace the intro skip beats so
# they don't all fire while still on the BIOS screen.
# t=2: skip sirtech splash
AUTOTYPE -w 2 enter
# t=6: skip bradley credit hold
AUTOTYPE -w 6 enter
# t=10: skip credits scroll
AUTOTYPE -w 10 enter
# t=14: at main menu by now; press down twice + enter to pick a non-default
# menu slot (e.g. "Start New Party"). Adjust per actual menu layout if this
# isn't what we want.
AUTOTYPE -w 14 down down enter
# t=20: another beat to advance the next sub-menu / confirm
AUTOTYPE -w 20 enter
# Finally run wroot — keep this last so all AUTOTYPE commands have queued
# before the game grabs the keyboard.
wroot
