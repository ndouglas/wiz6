# DOSBox-X config for MCP-driven Wiz6 capture.
# Boots wroot.exe with autosave enabled (a save state every 3 seconds into
# slots 1..30) and AUTOTYPE pressing keys to advance through the intro.
# Used by the MCP server to surface a set of save snapshots across game
# states without manual gameplay.

[sdl]
output       = opengl
fullscreen   = false

[log]
logfile      = /Users/nathan/Projects/ndouglas/wiz6/tools/dosbox/dosbox-autodrive.log

[dosbox]
machine      = vgaonly
memsize      = 16
quit warning = false
saveremark   = false
# autosave = <interval-seconds> <slot-range>. Cycles through slots 1..30
# saving once every 3s — enough resolution to catch each game-state
# transition without overwhelming disk.
autosave     = 3 1-30

[cpu]
cputype      = 386
cycles       = fixed 6000

[render]
aspect       = true

[autoexec]
mount c /Users/nathan/Projects/ndouglas/wiz6/original
c:
cls
# AUTOTYPE: wait 1s then start wiz6, after another 4s press ENTER to
# skip the sirtech splash, ENTER again for bradley, ENTER again to
# accelerate through the scroll. Tunes the timing to whatever the engine
# accepts; values in seconds, decimals OK. The `&&` is just shell-style
# sequencing inside the bat.
AUTOTYPE -w 1 -p 0.05 w r o o t enter
AUTOTYPE -w 5 enter
AUTOTYPE -w 8 enter
AUTOTYPE -w 12 enter
